<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{font:14px Segoe UI,Arial;color:#eaf3ff;background:transparent;display:none}main{position:absolute;right:3vw;top:7vh;width:340px;max-height:85vh;overflow:auto;border:1px solid #48617b;border-radius:16px;background:#0f1a2bf5;padding:18px;box-shadow:0 15px 55px #0009}h2{color:#6ce0da;margin:0}p,small,label{color:#a8bed0}p{font-size:12px}label{font-size:12px}button,input,select{color:white;background:#1d324c;border:1px solid #405e79;border-radius:6px;padding:9px;width:100%;margin:4px 0 7px;font:inherit}button{cursor:pointer}button:hover{background:#36587a}.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}.go{background:#167566}#close{float:right;width:auto;border:0;background:transparent;font-size:22px;padding:0}</style></head><body><main><button id="close">×</button><h2>REALITY VEHICLE LAB</h2><p>F6 = toggle menu | /v model = spawn</p><select id="cars"></select><input id="model" placeholder="Spawn name (e.g. m2cs)"><button class="go" onclick="spawn()">SPAWN / RESPAWN</button><div class="row"><button onclick="act('repair')">Repair</button><button onclick="act('clean')">Clean</button><button onclick="act('flip')">Unflip</button></div><div class="row"><button onclick="act('day')">Day</button><button onclick="act('night')">Night</button><button onclick="act('airport')">Airport</button></div><div class="row"><button onclick="act('mods')">Max mods</button><button onclick="act('delete')">Delete</button></div><label>Extra 0–14</label><div class="row"><input id="extra" type="number" min="0" max="14" value="1"><button onclick="act('extras','extra')">Toggle extra</button></div><label>Livery index</label><div class="row"><input id="livery" type="number" min="0" max="99" value="0"><button onclick="act('livery','livery')">Set livery</button></div><label>Primary color index</label><div class="row"><input id="paint" type="number" min="0" max="160" value="0"><button onclick="act('paint','paint')">Set color</button></div><label>License plate (8 characters max)</label><div class="row"><input id="plate" maxlength="8" value="TEST 001"><button onclick="act('plate','plate')">Set plate</button></div><small>For new model/texture: Reload in desktop dashboard; if cached, reconnect.</small></main><script>
const $=id=>document.getElementById(id),call=(s,d)=>fetch('https://'+GetParentResourceName()+'/'+s,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})});let known=[];
function draw(){let old=$('model').value;$('cars').replaceChildren();let start=document.createElement('option');start.textContent='Select imported vehicle...';start.value='';$('cars').append(start);for(let v of known){let o=document.createElement('option');o.value=v.spawn;o.textContent=v.name+(v.mode==='quick'?' (quick → '+v.spawn+')':'');$('cars').append(o)}if(known.length===1&&!old){$('model').value=known[0].spawn;$('cars').value=known[0].spawn}}
$('cars').onchange=()=>{if($('cars').value)$('model').value=$('cars').value};function spawn(){call('spawn',{model:$('model').value.trim()})}function act(action,id){let v=id?$(id).value:undefined;call('action',{action,number:Number(v)||0,value:v})}$('close').onclick=()=>call('close');document.onkeydown=e=>{if(e.key==='Escape')call('close')};onmessage=e=>{let d=e.data;if(d.type==='close')document.body.style.display='none';if(d.type==='open'){document.body.style.display='block';known=d.vehicles||[];draw();if(d.selected)$('model').value=d.selected}if(d.type==='catalog'){known=d.vehicles||[];draw()}};
</script></body></html>
